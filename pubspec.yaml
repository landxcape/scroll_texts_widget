version: 0.1.3
homepage: https://github.com/landxcape/scroll_texts_widget
repository: https://github.com/landxcape/scroll_texts_widget
issue_tracker: https://github.com/landxcape/scroll_texts_widget/issues
license: MIT
topics:
  - marquee
  - ticker
  - scrolling
  - text
  - animation

environment:
  sdk: ^3.9.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
